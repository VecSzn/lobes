[project]
name = "lobes"
version = "0.0.1"
description = "An experimental local AI runtime that relays a request through five small specialist models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
eval = ["pandas>=2", "pyarrow>=15"]
ocr = ["rapidocr-onnxruntime>=1.4"]   # second reader for images, cpu, ~2 s per image

[project.scripts]
lobes = "lobes.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lobes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]      # on linux bin/ holds the llama.cpp source tree, which has its own tests

[tool.ruff]
line-length = 155
extend-exclude = ["lobes/hard", "eval/data", "bin"]   # graders copied from their authors, and downloaded suites

[tool.ruff.lint]
# the rules that catch a bug rather than a habit: undefined and unused names, mutable defaults,
# a return inside finally, except Exception with nothing raised from it
select = ["F", "E9", "B002", "B006", "B012", "B017", "B904"]
