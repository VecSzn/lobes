[project]
name = "lobes"
version = "0.0.1"
description = "An experimental modular AI runtime that coordinates specialized small-model lobes with evidence-based verification and dynamic model swapping, built to fit in 8 GB of VRAM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
eval = ["pandas>=2", "pyarrow>=15"]
ocr = ["rapidocr-onnxruntime>=1.4"]   # second reader for images, cpu, ~2 s per image

[project.scripts]
lobes = "lobes.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lobes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]      # on linux bin/ holds the llama.cpp source tree, which has its own tests
