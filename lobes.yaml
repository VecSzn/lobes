# everything about which model does what lives here. code never hardcodes a model name.

llama:
  release: b10951            # ggml-org/llama.cpp release tag
  cuda: "13.3"               # driver 610 supports 13.x; use "12.4" on older drivers
  host: 127.0.0.1
  port: 8080
  ctx: 16384
  # threads: 8              # llama-server starts one thread per core it sees; set this on a box with a cpu quota
  parallel: 1                # requests per model at once. with 4 slots sharing one context, two long conversations
                             # both failed; with 1 the second one waits. the eval box used 4
  vram_budget_mb: 6800       # 8188 total minus what the desktop already holds; recalibrate from `lobes models`.
                             # qwen3.5-4b at 131k and gemma4-e2b together peaked at 7578 of 8188 with the desktop

# name -> where to get it, how much GPU memory it takes, where it runs.
# vram_mb = nvidia-smi delta measured 2026-09-14 after loading with ctx 16384, 4 slots, and one 512-token generation
# sha256 = the file as downloaded from the repo on the line above. `lobes install` deletes anything that differs,
#          which is what keeps HF_ENDPOINT safe to point at a mirror. A repo that requantizes will trip it; re-check
#          the file on its model page, then update the hash here.
models:
  brick-2-max:               # easy/medium/hard classifier on Qwen3.5-0.8B; CC BY-NC 4.0, English only
    repo: regolo/brick-complexity-2-max-Q8_0-GGUF
    file: brick-complexity-2-max-Q8_0.gguf
    sha256: a5c06b8aac357ed94b5bc78fb11f846244c63b1c173c67b1ead33c24533f8b17
    device: cpu
    resident: true
    vram_mb: 0
  qwen3.5-2b:
    repo: unsloth/Qwen3.5-2B-GGUF
    file: Qwen3.5-2B-Q4_K_M.gguf
    sha256: aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223
    mmproj: mmproj-F16.gguf
    mmproj_sha256: 7035e9cb8d7c6a9681d07eef9a364783e86ea4cd73faab2eabb4f43a101830c7
    vram_mb: 2600
    thinking: true
  qwen3.5-4b:
    repo: unsloth/Qwen3.5-4B-GGUF
    file: Qwen3.5-4B-Q4_K_M.gguf
    sha256: 00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4
    vram_mb: 3750            # nvidia-smi delta at the ctx and kv below; was 4638 at ctx 131072
    ctx: 65536               # Codex sends ~18k tokens of prompt and tools before any work. at 131072 the cache
                             # left no room for the tool hand, so every handoff swapped a model out
    kv: q4_0                 # 1.1 GB of cache at 131072; found 3 of 3 planted facts in a 99k prompt
    preset: {spec-type: ngram-map-k}   # drafts from the context: a copied file ran 280 -> 1034 tok/s on the pod 5090
    thinking: true
  qwen3.5-4b-vl:
    repo: unsloth/Qwen3.5-4B-GGUF
    file: Qwen3.5-4B-Q4_K_M.gguf
    sha256: 00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4
    mmproj: mmproj-F16.gguf
    mmproj_sha256: cd88edcf8d031894960bb0c9c5b9b7e1fea6ebee02b9f7ce925a00d12891f864
    vram_mb: 4300
    thinking: true
  granite-h-micro:
    repo: ibm-granite/granite-4.0-h-micro-GGUF
    file: granite-4.0-h-micro-Q4_K_M.gguf
    sha256: bcc78b9b25450101d1ad90d4b9a264e1bac892f534dfb76066f4eec792fdf023
    vram_mb: 2300            # nvidia-smi delta, alone at the default ctx
  gemma4-e2b:
    repo: unsloth/gemma-4-E2B-it-GGUF
    file: gemma-4-E2B-it-Q4_K_M.gguf
    sha256: 740185b21d22ceb83a11c3aa62ad5842ef32c70f6096d756bbee85a1e4ec34b8
    ctx: 32768
    vram_mb: 1900            # nvidia-smi delta, alone at the ctx above; 1800 at ctx 16384
    tools: false             # llama.cpp gets this model's calls as plain text, so it is given none
  granite-1b:                # topic router in the v1 profile, 0.85 s a call on the CPU
    repo: ibm-granite/granite-4.0-h-1b-GGUF
    file: granite-4.0-h-1b-Q8_0.gguf
    sha256: f29248184ca766350e56e6d161c2a637ad302a6d595e15d4a62cd58327a0ac0e
    device: cpu
    resident: true
    vram_mb: 0
  nemotron-3-nano-4b:        # math expert in the v1 profile; NVIDIA open model license, English
    repo: lmstudio-community/NVIDIA-Nemotron-3-Nano-4B-GGUF
    file: NVIDIA-Nemotron-3-Nano-4B-Q4_K_M.gguf
    sha256: 083af225449463dd7c38bebc888f9dcad187b834d8b15e08c297dda37c968b50
    ctx: 131072              # at 32768 a 38k-token Codex prompt ran out of room; 4 of its 42 layers hold a kv cache
    kv: q8_0                 # found 3 of 3 planted facts in a 106k prompt
    vram_mb: 4550            # nvidia-smi peak delta during that prompt, alone; 3550 at ctx 32768 f16
    thinking: true
  qwen3.5-9b:
    repo: unsloth/Qwen3.5-9B-GGUF
    file: Qwen3.5-9B-IQ4_XS.gguf
    sha256: 7e918aeca06c52bcb528ea6b04b4ec957e75ee8c0a73138854c0dfcf371ea429
    vram_mb: 5200
    thinking: true

providers:
  local:    { type: openai, base_url: http://127.0.0.1:8080/v1 }
  lmstudio: { type: openai, base_url: http://127.0.0.1:1234/v1 }

# low | medium | high: the same relay at every level; the level sets how long reasoning may think per call
# (1024, 4096, 8192 tokens) and the request's caps (lobes/runner.py EFFORT).
effort: medium

# a lobe is filled with "provider/model", or a non-LLM implementation name.
profile: specialists
profiles:
  specialists:                      # one family per lobe where it doesn't hurt; swapping is the normal case
    executive:  local/brick-2-max     # granite-1b called most hard requests simple
    perception: local/qwen3.5-2b
    reasoning:  local/qwen3.5-4b
    motor:      local/granite-h-micro
    language:   local/gemma4-e2b
  shared:                           # same weights, different prompts; nothing swaps
    executive:  local/brick-2-max
    perception: local/qwen3.5-4b-vl
    reasoning:  local/qwen3.5-4b-vl
    motor:      local/qwen3.5-4b-vl
    language:   passthrough
  v1:                               # lobes-v1: a router picks one expert per request, the expert holds the tools, gemma reviews
    executive:  local/brick-2-max     # simple or hard
    router:     local/granite-1b      # which expert
    perception: local/qwen3.5-2b
    reasoning:  local/qwen3.5-4b      # when the router's reply does not parse; greetings land here too
    code:       local/qwen3.5-4b
    math:       local/nemotron-3-nano-4b
    knowledge:  local/qwen3.5-4b
    motor:      none
    language:   local/gemma4-e2b
  # eval controls: one model in every slot, same scaffolding. "none" = slot empty (no vision)
  bare-9b:                          # eval baseline T: the 9B thinks and holds every tool itself; no classifier, tool hand or review
    executive:  none
    perception: none
    reasoning:  local/qwen3.5-9b
    motor:      none
    language:   passthrough
  bare-4b:                          # the relay's own solver with every tool and no other lobe: what the division of labour is worth
    executive:  none
    perception: none
    reasoning:  local/qwen3.5-4b
    motor:      none
    language:   passthrough
  single-9b:                        # the 9B alone is also the eval baseline R: one call, no lobes
    executive:  local/qwen3.5-9b
    perception: none
    reasoning:  local/qwen3.5-9b
    motor:      local/qwen3.5-9b
    language:   passthrough
  single-4b:
    executive:  local/qwen3.5-4b-vl
    perception: local/qwen3.5-4b-vl
    reasoning:  local/qwen3.5-4b-vl
    motor:      local/qwen3.5-4b-vl
    language:   passthrough
